org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Enable built-in Kotlin so Flutter manages KGP for all plugins (avoids file-lock conflict)
android.builtInKotlin=true
# Disable incremental Kotlin compilation to avoid file locking race conditions
kotlin.incremental=false
# Disable parallel builds to prevent concurrent Kotlin cache access
org.gradle.parallel=false
